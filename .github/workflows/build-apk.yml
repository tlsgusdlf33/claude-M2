name: Build APK

# 앱 껍데기를 바꿀 때만 필요하다 (플러그인 추가, 권한, 아이콘, 시작 화면 등).
# 게임 내용만 고친 경우에는 ota.yml 이 업데이트를 올려 주므로 APK를 다시 설치하지 않아도 된다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "tools/shell.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Wrap the game for the app
        run: |
          VERSION=$(date -u +%Y%m%d%H%M%S)
          python3 tools/make-www.py prototype/index.html android-app/www --version "$VERSION" \
            --base "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/"

      - name: Create the Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          # 세로 화면 고정
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' "$M"
          # 구글 광고(테스트 앱 ID)와 결제 권한. 출시 때는 실제 앱 ID로 바꾼다
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' "$M"
          sed -i '0,/<application/s##<uses-permission android:name="com.android.vending.BILLING"/><uses-permission android:name="com.google.android.gms.permission.AD_ID"/><application#' "$M"
          cat "$M"
          npx cap sync android

      # 같은 서명 키를 쓰면 새 APK를 지우지 않고 덮어 설치할 수 있다 (디버그용 임시 키).
      # ~/.android/debug.keystore 를 바꿔치기하는 방법은 적용되지 않아서, Gradle 설정에 키를 직접 지정한다.
      - name: Sign with the fixed debug keystore
        working-directory: android-app
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk moonlight-debug.apk

      - name: Check that the APK uses the fixed key
        run: |
          EXPECTED=$(keytool -list -keystore android-app/debug.keystore -storepass android | grep -i 'SHA-256' | sed 's/.*: //')
          ACTUAL=$(keytool -printcert -jarfile moonlight-debug.apk | grep 'SHA256' | head -1 | sed 's/.*SHA256: //')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "달빛 온실 APK #${{ github.run_number }}"
          prerelease: true
          files: moonlight-debug.apk
